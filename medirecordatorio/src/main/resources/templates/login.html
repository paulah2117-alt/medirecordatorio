<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIRECORDATORIO - Ingreso al Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <div class="card-body text-center">
                    <!-- Título con ajuste automático y emoticonos solicitados -->
                    <h1 class="fw-bold text-success mb-2 fs-3 text-nowrap">
                        ⏰ MEDIRECORDATORIO 💊
                    </h1>
                    <h2 class="h6 text-secondary mb-4">Ingreso al Sistema</h2>

                    <div th:if="${mensajeExito}" class="alert alert-success text-start mb-3" th:text="${mensajeExito}"></div>
                    <div th:if="${mensajeError}" class="alert alert-danger text-start mb-3">
                        <div th:text="${mensajeError}"></div>
                        <div class="mt-2 text-center">
                            <a href="/registro" class="btn btn-sm btn-outline-danger fw-bold">Crear una cuenta nueva</a>
                        </div>
                    </div>

                    <form th:action="@{/login}" method="post" class="text-start">
                        <div class="mb-3">
                            <label for="rol" class="form-label fw-bold">Tipo de Usuario:</label>
                            <select id="rol" name="rol" class="form-select" required>
                                <option value="PACIENTE">Paciente</option>
                                <option value="MEDICO">Personal Médico</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="documento" class="form-label fw-bold">Número de Documento:</label>
                            <input type="text" id="documento" name="documento" class="form-control" required placeholder="Ingrese su documento">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold">Contraseña:</label>
                            <input type="password" id="password" name="password" class="form-control" required placeholder="Ingrese su contraseña">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Iniciar Sesión</button>
                    </form>

                    <div class="mt-3">
                        <a href="/registro" class="text-decoration-none">¿No tienes cuenta? Regístrate aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

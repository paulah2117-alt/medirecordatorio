<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediRecordatorio - Sistema de Gestión</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3faf4; color: #0b1f3a; padding: 20px; }
        main { max-width: 950px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #14532d; margin-bottom: 10px; }
        .nav-panel { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 9px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; text-decoration: none; display: inline-block; }
        .btn-green { background-color: #2e7d32; }
        .btn-blue { background-color: #0284c7; }
        .btn-red { background-color: #dc2626; }
        .btn-yellow { background-color: #d97706; }
        .btn-dark { background-color: #374151; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #e8f5e9; color: #14532d; }
    </style>
</head>
<body>

<main>
    <h1>MediRecordatorio - Panel Principal</h1>
    <p>Sistema modular para prescripciones, pacientes y personal médico.</p>

    <!-- NAVEGACIÓN COMPLETA A TODAS LAS VISTAS -->
    <div class="nav-panel">
        <a href="/formulario-medicamento" class="btn btn-blue">+ Formulario Medicamentos</a>
        <a href="/login-paciente" class="btn btn-dark">Login Paciente</a>
        <a href="/login-usuario" class="btn btn-dark">Login Personal Médico</a>
    </div>

    <!-- SECCIÓN CRUD DE MEDICAMENTOS (SEMANA 9) -->
    <div style="background:#e8f5e9; padding:20px; border-radius:8px; margin-bottom:20px;">
        <h3 id="formTitle">Registrar Nuevo Medicamento</h3>
        <input type="hidden" id="medId">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="nombre" placeholder="Ej. Losartán">
            </div>
            <div class="form-group">
                <label>Dosis:</label>
                <input type="text" id="dosis" placeholder="Ej. 50 mg">
            </div>
            <div class="form-group">
                <label>Hora:</label>
                <input type="text" id="hora" placeholder="Ej. 08:00 AM">
            </div>
            <div class="form-group">
                <label>Frecuencia:</label>
                <input type="text" id="frecuencia" placeholder="Ej. Cada 12 horas">
            </div>
        </div>

        <button class="btn btn-green" onclick="guardarMedicamento()">Guardar Registro</button>
        <button class="btn btn-yellow" onclick="limpiarFormulario()">Limpiar / Cancelar</button>
    </div>

    <h3>Medicamentos en Base de Datos MySQL</h3>
    <button class="btn btn-blue" onclick="cargarMedicamentos()">Refrescar Lista</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Dosis</th>
            <th>Hora</th>
            <th>Frecuencia</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody id="tablaCuerpo"></tbody>
    </table>
</main>

<script>
    const API_URL = '/api/medicamentos';
    let listaGlobalMedicamentos = [];

    document.addEventListener("DOMContentLoaded", cargarMedicamentos);

    async function cargarMedicamentos() {
        try {
            const respuesta = await fetch(API_URL);
            listaGlobalMedicamentos = await respuesta.json();
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            listaGlobalMedicamentos.forEach(med => {
                tbody.innerHTML += `
                    <tr>
                        <td>${med.id}</td>
                        <td><strong>${med.nombre || ''}</strong></td>
                        <td>${med.dosis || '-'}</td>
                        <td>${med.hora || '-'}</td>
                        <td>${med.frecuencia || '-'}</td>
                        <td>
                            <button class="btn btn-yellow" onclick="prepararEdicion(${med.id})">Editar</button>
                            <button class="btn btn-red" onclick="eliminarMedicamento(${med.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error("Error al cargar lista:", e);
        }
    }

    function prepararEdicion(id) {
        const med = listaGlobalMedicamentos.find(m => m.id === id);
        if (med) {
            document.getElementById('medId').value = med.id;
            document.getElementById('nombre').value = med.nombre || '';
            document.getElementById('dosis').value = med.dosis || '';
            document.getElementById('hora').value = med.hora || '';
            document.getElementById('frecuencia').value = med.frecuencia || '';
            document.getElementById('formTitle').innerText = "Editar Medicamento #" + med.id;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    async function guardarMedicamento() {
        const idVal = document.getElementById('medId').value;
        const medicamento = {
            id: idVal ? parseInt(idVal) : null,
            nombre: document.getElementById('nombre').value,
            dosis: document.getElementById('dosis').value,
            hora: document.getElementById('hora').value,
            frecuencia: document.getElementById('frecuencia').value
        };

        if (!medicamento.nombre) {
            alert("El nombre es obligatorio");
            return;
        }

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(medicamento)
        });

        limpiarFormulario();
        cargarMedicamentos();
    }

    async function eliminarMedicamento(id) {
        if (confirm(`¿Seguro que deseas eliminar el registro #${id}?`)) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            cargarMedicamentos();
        }
    }

    function limpiarFormulario() {
        document.getElementById('medId').value = '';
        document.getElementById('nombre').value = '';
        document.getElementById('dosis').value = '';
        document.getElementById('hora').value = '';
        document.getElementById('frecuencia').value = '';
        document.getElementById('formTitle').innerText = "Registrar Nuevo Medicamento";
    }
</script>

</body>
</html>

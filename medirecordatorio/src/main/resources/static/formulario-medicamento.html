<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Medicamento - Semana 7</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 25px; }
        main { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1e40af; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .campo { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }
        input, select, textarea { width: 95%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; }
        .error { color: #dc2626; font-size: 0.85em; margin-top: 4px; display: block; font-weight: bold; }
        .btn-guardar { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-cancelar { background: #64748b; color: white; text-decoration: none; padding: 9px 15px; border-radius: 5px; font-weight: bold; font-size: 0.9em; margin-left: 10px; }
    </style>
</head>
<body>
<main>
    <h2>➕ Registrar Nuevo Medicamento</h2>

    <form th:action="@{/medicamentos/guardar}" th:object="${medicamentoForm}" method="post">

        <div class="campo">
            <label>Nombre del Medicamento:</label>
            <input type="text" th:field="*{nombre}" placeholder="Ej: Amoxicilina">
            <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>

        <div class="campo">
            <label>Categoría Terapéutica:</label>
            <select th:field="*{categoria}">
                <option value="">-- Seleccione --</option>
                <option value="Hipertensión">Hipertensión</option>
                <option value="Diabetes">Diabetes</option>
                <option value="Anticonvulsivos">Anticonvulsivos</option>
                <option value="Antidepresivos">Antidepresivos</option>
                <option value="Antiinflamatorios">Antiinflamatorios</option>
                <option value="Analgésicos">Analgésicos</option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
        </div>

        <div class="campo">
            <label>¿Para qué sirve?:</label>
            <input type="text" th:field="*{paraQueSirve}" placeholder="Ej: Tratar infecciones bacterianas">
            <span class="error" th:if="${#fields.hasErrors('paraQueSirve')}" th:errors="*{paraQueSirve}"></span>
        </div>

        <div class="campo">
            <label>Dosis:</label>
            <input type="text" th:field="*{dosis}" placeholder="Ej: 500 mg">
            <span class="error" th:if="${#fields.hasErrors('dosis')}" th:errors="*{dosis}"></span>
        </div>

        <div class="campo">
            <label>Hora de toma:</label>
            <input type="text" th:field="*{hora}" placeholder="Ej: 08:00 AM">
            <span class="error" th:if="${#fields.hasErrors('hora')}" th:errors="*{hora}"></span>
        </div>

        <div class="campo">
            <label>Frecuencia (en horas):</label>
            <input type="number" th:field="*{frecuenciaHoras}" placeholder="Ej: 8">
            <span class="error" th:if="${#fields.hasErrors('frecuenciaHoras')}" th:errors="*{frecuenciaHoras}"></span>
        </div>

        <div class="campo">
            <label>Efectos Secundarios:</label>
            <input type="text" th:field="*{efectosSecundarios}" placeholder="Ej: Diarrea, sarpullido">
            <span class="error" th:if="${#fields.hasErrors('efectosSecundarios')}" th:errors="*{efectosSecundarios}"></span>
        </div>

        <div class="campo">
            <label>⚠️ No mezclar con:</label>
            <input type="text" th:field="*{interaccionesNoPermitidas}" placeholder="Ej: Anticonceptivos orales">
            <span class="error" th:if="${#fields.hasErrors('interaccionesNoPermitidas')}" th:errors="*{interaccionesNoPermitidas}"></span>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-guardar">Guardar Medicamento</button>
            <a th:href="@{/medicamentos}" class="btn-cancelar">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>

# Configuración general
spring.application.name=medirecordatorio
server.port=8080
spring.profiles.active=dev
logging.level.com.etitc.medirecordatorio=DEBUG

# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/medidb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Expiración de la sesión (60 segundos / 1 minuto)
server.servlet.session.timeout=60s
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de Sesión</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main style="max-width: 450px;">
  <h2>Ingreso al Sistema</h2>

  <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
  <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label>Tipo de Usuario:</label>
      <select name="rol">
        <option value="PACIENTE">Paciente</option>
        <option value="MEDICO">Personal Médico</option>
      </select>
    </div>

    <div class="form-group">
      <label>Número de Documento:</label>
      <input type="text" name="documento" required>
    </div>

    <div class="form-group">
      <label>Contraseña:</label>
      <input type="password" name="password" required>
    </div>

    <button type="submit" class="btn btn-blue" style="width: 100%;">Iniciar Sesión</button>
  </form>
  <br>
  <a href="/">← Volver al Inicio</a>
</main>
</body>
</html>
